{{ define "main" }}
<div class="wrap">
<article class="writeup-page">
  <div class="eyebrow accent article-eyebrow">
    {{- with .Params.updated }}Last updated <time datetime="{{ . }}">{{ time.Format "2 Jan 2006" . }}</time>{{ else }}<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan 2006" }}</time>{{ end }}
  </div>
  <h1 class="article-title">{{ .Title }}</h1>
  {{- with .Params.summary }}<p class="byline">{{ . }}</p>{{ end }}
  <div class="article-columns">
    <div class="writeup prose">
      {{ .Content }}
    </div>
  </div>
</article>
</div>
{{ end }}
