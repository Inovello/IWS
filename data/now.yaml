now:
  updated: "Sep 2026"
  line: "Prefill is the problem now. Most of it goes on moving weights, not multiplying them."
  items:
    - tag: Profiling
      highlight: true
      title: "Prefill on long documents"
      text: >-
        A traced 8k-token request spends about 74 seconds moving weights host to device on the first
        GPU against roughly 5 seconds of kernel time. So the target is repeated expert upload volume,
        not the kernels. Reading the existing staging and prefetch work before writing anything.
    - tag: PR open
      title: "llama.cpp #28223"
      url: https://github.com/ggml-org/llama.cpp/pull/28223
      text: >-
        Keeps an explicit `-ot` host buffer override from being silently downgraded to a plain CPU
        buffer under mmap, and reads pinned tensors from the file instead of faulting them through
        the mapping. Prefill 166 to 379 t/s with 40 expert layers on the host; load 512 s to 168 s.
